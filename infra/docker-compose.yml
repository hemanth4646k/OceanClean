name: oceanclean

x-py: &py
  image: oceanclean-py
  build: { context: .., dockerfile: infra/docker/python.Dockerfile }
  env_file: ../.env
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.7.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports: ["29092:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4-alpine
    env_file: ../.env
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ../.env
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    mem_limit: 512m
    restart: unless-stopped

  minio-init:
    <<: *py
    command: python infra/minio/init_bucket.py
    depends_on: [minio]
    restart: "no"

  ingestion:
    <<: *py
    command: uvicorn ingestion_app:app --host 0.0.0.0 --port 8000
    environment: { KAFKA_BOOTSTRAP: "kafka:9092" }
    ports: ["8001:8000"]
    depends_on: { kafka: { condition: service_healthy } }
    healthcheck:
      test: python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"
      interval: 3s
      retries: 30
    mem_limit: 256m

  simulator:
    <<: *py
    command: python simulator/sim_main.py
    environment: { INGEST_URL: "http://ingestion:8000/telemetry", SIM_STATE_FILE: /state/OC-01.json }
    volumes: [sim-state:/state]
    depends_on: { ingestion: { condition: service_healthy } }
    mem_limit: 256m

  spark-stream:
    image: oceanclean-spark
    build: { context: .., dockerfile: infra/docker/spark.Dockerfile }
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PG_DSN: postgresql://ocean:ocean@postgis:5432/oceanclean
      CHECKPOINT_DIR: /checkpoints/telemetry
    command: >
      /opt/bitnami/spark/bin/spark-submit --master local[2] --driver-memory 1g
      --conf spark.ui.port=4040 /app/streaming/telemetry_stream.py
    volumes:
      - ../common:/app/common:ro
      - ../streaming:/app/streaming:ro
      - ../routing:/app/routing:ro
      - ../batch:/app/batch:ro
      - spark-checkpoints:/checkpoints
    ports: ["4040:4040"]
    depends_on:
      kafka: { condition: service_healthy }
      postgis: { condition: service_healthy }
      ingestion: { condition: service_healthy }
    mem_limit: 2g
    restart: unless-stopped

volumes:
  kafka-data:
  pgdata:
  minio-data:
  spark-checkpoints:
  sim-state:
