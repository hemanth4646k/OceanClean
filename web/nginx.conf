server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve `api` through Docker's DNS at request time (a variable in proxy_pass), so a
    # recreated API container (new IP, e.g. after infra/reset_sim.sh) does not leave nginx
    # proxying to a dead address with 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # REST: /api/x -> api:8000/x (same paths as the Vite dev proxy).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    location /ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
